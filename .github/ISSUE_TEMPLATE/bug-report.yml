name: Bug report
description: Something in the app doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: battery
    attributes:
      label: Battery
      description: Brand and part number from the label on the battery, if a battery was involved.
      placeholder: EcoTree Lithium EL12.8-110HB
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: >-
        In the app, open "About & diagnostics" (from the ⋮ menu, or the link at the bottom of the connect
        screen), tap Copy, and paste it here. It includes the app and Android versions, so you don't need
        to look them up.
      render: text
